<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeMax Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
        }

        .logo span {
            color: white;
        }

        .video-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            margin-top: 15px;
            background: #222;
            padding: 15px;
            border-radius: 30px;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .play-btn {
            background: #333;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .play-btn:hover {
            background: #444;
        }

        .time {
            color: #aaa;
            font-size: 14px;
            min-width: 100px;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: #444;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ff0000;
            border-radius: 5px;
        }

        .speed-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
            justify-content: center;
        }

        .speed-btn {
            background: #333;
            border: none;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .speed-btn:hover {
            background: #444;
            color: white;
        }

        .speed-btn.active {
            background: #ff0000;
            color: white;
        }

        .file-input-wrapper {
            margin-top: 15px;
            text-align: center;
        }

        .file-input-wrapper input {
            display: none;
        }

        .file-input-wrapper label {
            background: #ff0000;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
        }

        .file-input-wrapper label:hover {
            background: #cc0000;
        }

        .footer {
            text-align: center;
            margin-top: 12px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">▶ <span>TubeMax</span></div>
        <div style="color:#666; font-size:14px;">⚡ 8x Speed</div>
    </div>

    <!-- Video Player -->
    <div class="video-wrapper">
        <video id="videoPlayer" controls style="display:none;"></video>
        <div id="placeholder" style="display:flex; justify-content:center; align-items:center; height:100%; color:#666; font-size:18px; flex-direction:column; gap:10px;">
            <div style="font-size:50px;">🎬</div>
            <div>Click below to select video</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="top-controls">
            <button class="play-btn" id="playBtn">▶</button>
            <span class="time" id="timeDisplay">0:00 / 0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="speed-controls">
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="2">2x</button>
            <button class="speed-btn" data-speed="3">3x</button>
            <button class="speed-btn" data-speed="4">4x</button>
            <button class="speed-btn" data-speed="5">5x</button>
            <button class="speed-btn" data-speed="6">6x</button>
            <button class="speed-btn" data-speed="7">7x</button>
            <button class="speed-btn" data-speed="8">8x</button>
        </div>
    </div>

    <!-- File Upload -->
    <div class="file-input-wrapper">
        <input type="file" id="fileInput" accept="video/*">
        <label for="fileInput">📁 Select Video File</label>
    </div>

    <div class="footer">
        <i class="fas fa-code"></i> GitHub Ready — MX-style speed up to 8x
    </div>
</div>

<script>
    // ========== DOM ELEMENTS ==========
    const video = document.getElementById('videoPlayer');
    const placeholder = document.getElementById('placeholder');
    const playBtn = document.getElementById('playBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const fileInput = document.getElementById('fileInput');
    const speedBtns = document.querySelectorAll('.speed-btn');

    let isDragging = false;

    // ========== HELPER FUNCTIONS ==========
    function formatTime(sec) {
        if (isNaN(sec) || sec < 0) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateUI() {
        if (!video.duration || isNaN(video.duration)) {
            timeDisplay.textContent = '0:00 / 0:00';
            progressFill.style.width = '0%';
            return;
        }
        const current = video.currentTime;
        const duration = video.duration;
        const percent = (current / duration) * 100;
        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        progressFill.style.width = `${Math.min(percent, 100)}%`;
    }

    function togglePlay() {
        if (video.paused) {
            video.play().catch(err => console.log('Play error:', err));
        } else {
            video.pause();
        }
    }

    function updatePlayIcon() {
        playBtn.textContent = video.paused ? '▶' : '⏸';
    }

    function setSpeed(speed) {
        video.playbackRate = speed;
        speedBtns.forEach(btn => {
            const val = parseFloat(btn.dataset.speed);
            btn.classList.toggle('active', Math.abs(val - speed) < 0.01);
        });
    }

    function seek(e) {
        const rect = progressBar.getBoundingClientRect();
        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
        if (!clientX) return;
        let x = (clientX - rect.left) / rect.width;
        x = Math.min(Math.max(x, 0), 1);
        if (video.duration && !isNaN(video.duration)) {
            video.currentTime = x * video.duration;
        }
        progressFill.style.width = `${x * 100}%`;
        if (video.duration) {
            timeDisplay.textContent = `${formatTime(x * video.duration)} / ${formatTime(video.duration)}`;
        }
    }

    // ========== FILE UPLOAD ==========
    fileInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        video.src = url;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        
        video.load();
        video.play().catch(err => console.log('Play error:', err));
        
        // Reset speed to 1x
        setSpeed(1);
    });

    // ========== EVENT LISTENERS ==========
    playBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);
    video.addEventListener('play', updatePlayIcon);
    video.addEventListener('pause', updatePlayIcon);

    video.addEventListener('timeupdate', () => {
        if (!isDragging) updateUI();
    });

    video.addEventListener('loadedmetadata', () => {
        updateUI();
        setSpeed(1);
    });

    video.addEventListener('ended', () => {
        updatePlayIcon();
        updateUI();
    });

    // Speed Buttons
    speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            setSpeed(parseFloat(btn.dataset.speed));
        });
    });

    // Progress Bar - Mouse
    progressBar.addEventListener('mousedown', (e) => {
        isDragging = true;
        seek(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (isDragging) seek(e);
    });

    window.addEventListener('mouseup', (e) => {
        if (isDragging) {
            isDragging = false;
            seek(e);
            updateUI();
        }
    });

    // Progress Bar - Touch
    progressBar.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isDragging = true;
        seek(e);
    }, { passive: false });

    progressBar.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (isDragging) seek(e);
    }, { passive: false });

    progressBar.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (isDragging) {
            isDragging = false;
            seek(e);
            updateUI();
        }
    }, { passive: false });

    // Keyboard Space
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !e.target.matches('input, textarea, button')) {
            e.preventDefault();
            togglePlay();
        }
    });

    console.log('✅ TubeMax Player Ready!');
    console.log('💡 Click "Select Video File" to upload your video.');
</script>

</body>
</html>
