<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My YouTube Player</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    font-size: 25px;
}

input {
    width: 65%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    padding: 11px 14px;
    margin: 4px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    font-weight: bold;
}

button:active {
    background: #666;
}

.player-box {
    width: 95%;
    max-width: 900px;
    margin: 20px auto;
    overflow: hidden;
    background: black;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    transform-origin: center;
    transition: transform 0.2s;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.controls {
    margin: 15px;
}

.speed {
    background: #e00000;
}

.zoom {
    background: #0066cc;
}

</style>
</head>

<body>

<h1>🎬 My YouTube Player</h1>

<input
id="link"
placeholder="YouTube link yahan paste karo">

<button onclick="loadVideo()">
▶ PLAY
</button>

<div class="player-box">

<div id="zoomPlayer" class="player">

<iframe
id="video"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

</div>

</div>

<h3 id="text">
Video load karo
</h3>

<div class="controls">

<h3>⚡ Speed</h3>

<button class="speed" onclick="speed(1)">1×</button>
<button class="speed" onclick="speed(2)">2×</button>
<button class="speed" onclick="speed(3)">3×</button>
<button class="speed" onclick="speed(4)">4×</button>
<button class="speed" onclick="speed(5)">5×</button>
<button class="speed" onclick="speed(6)">6×</button>
<button class="speed" onclick="speed(7)">7×</button>
<button class="speed" onclick="speed(8)">8×</button>
<button class="speed" onclick="speed(9)">9×</button>

<h3>🔍 Zoom</h3>

<button class="zoom" onclick="zoomIn()">
＋ Zoom
</button>

<button class="zoom" onclick="zoomOut()">
− Zoom
</button>

<button onclick="normalZoom()">
Normal
</button>

<br>

<button onclick="fullScreen()">
⛶ Fullscreen
</button>

</div>


<script>

let videoID = "";
let zoom = 1;


// YouTube ID निकालना

function getID(url) {

    try {

        let u = new URL(url);

        if (u.hostname.includes("youtu.be")) {

            return u.pathname.substring(1);

        }

        if (u.hostname.includes("youtube.com")) {

            let id = u.searchParams.get("v");

            if (id) {
                return id;
            }

            let p = u.pathname.split("/");

            if (p[1] == "shorts") {
                return p[2];
            }

        }

    } catch(e) {

    }

    return null;
}


// Video चलाना

function loadVideo() {

    let url = document.getElementById("link").value;

    let id = getID(url);

    if (!id) {

        document.getElementById("text").innerText =
        "❌ YouTube link गलत है";

        return;

    }

    videoID = id;

    document.getElementById("video").src =
    "https://www.youtube.com/embed/" +
    id +
    "?enablejsapi=1&playsinline=1";

    document.getElementById("text").innerText =
    "✅ Video चल रहा है";

}


// Speed

function speed(number) {

    if (!videoID) {

        alert("पहले Video Play करो");

        return;

    }

    document.getElementById("video")
    .contentWindow
    .postMessage(

        JSON.stringify({

            event: "command",

            func: "setPlaybackRate",

            args: [number]

        }),

        "*"

    );

    document.getElementById("text").innerText =
    "Speed: " + number + "×";

}


// Zoom

function zoomIn() {

    if (zoom < 2) {

        zoom = zoom + 0.25;

    }

    document.getElementById("zoomPlayer")
    .style.transform =
    "scale(" + zoom + ")";

}


function zoomOut() {

    if (zoom > 1) {

        zoom = zoom - 0.25;

    }

    document.getElementById("zoomPlayer")
    .style.transform =
    "scale(" + zoom + ")";

}


function normalZoom() {

    zoom = 1;

    document.getElementById("zoomPlayer")
    .style.transform =
    "scale(1)";

}


// Fullscreen

function fullScreen() {

    let player =
    document.getElementById("video");

    if (player.requestFullscreen) {

        player.requestFullscreen();

    }

}

</script>

</body>
</html>
