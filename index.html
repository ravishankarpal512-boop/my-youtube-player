<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My YouTube Player</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}main{max-width:950px;margin:auto;padding:24px 16px;text-align:center}h1{font-size:28px;margin:10px 0 20px}.search{display:flex;gap:8px}input{flex:1;padding:14px;border:0;border-radius:9px;font-size:16px}button{padding:12px 17px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.play{background:#fff;color:#111}.player{margin-top:20px;background:#000;aspect-ratio:16/9;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.controls button{background:#292929;color:#fff}.msg{color:#bbb}</style></head><body><main><h1>🎬 My YouTube Player</h1><div class="search"><input id="url" placeholder="YouTube video URL paste karo"><button class="play" onclick="loadVideo()">▶ Play</button></div><div class="player"><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><p id="msg" class="msg">YouTube URL paste karke Play dabao.</p><div class="controls"><button onclick="setSpeed(1)">1×</button><button onclick="setSpeed(1.5)">1.5×</button><button onclick="setSpeed(2)">2×</button><button onclick="setSpeed(3)">3×</button><button onclick="setSpeed(4)">4×</button></div><p class="msg">YouTube embedded player ki supported speed hi actually apply hogi.</p></main><script>let videoId="";function getId(s){try{const u=new URL(s.trim());if(u.hostname.includes('youtu.be'))return u.pathname.split('/')[1];if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/');if(p[1]==='shorts'||p[1]==='embed')return p[2]}}catch(e){}return null}function loadVideo(){const id=getId(document.getElementById('url').value),msg=document.getElementById('msg');if(!id){msg.textContent='❌ Valid YouTube URL dalo.';return}videoId=id;document.getElementById('player').src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?enablejsapi=1&origin='+encodeURIComponent(location.origin);msg.textContent='✅ Video load ho gaya.'}function setSpeed(n){if(!videoId){document.getElementById('msg').textContent='❌ Pehle Play karo.';return}document.getElementById('player').contentWindow.postMessage(JSON.stringify({event:'command',func:'setPlaybackRate',args:[n]}),'*');document.getElementById('msg').textContent='Requested speed: '+n+'×'}</script></body></html>
